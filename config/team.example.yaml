# Скопируйте этот файл в config/team.yaml и подставьте свои значения.
# config/team.yaml не попадает в git (см. .gitignore) - в нём в итоге
# будет храниться общий для команды секретный ключ канала.

# Регион LoRa. Должен строго соответствовать стране использования устройств,
# иначе радиомодуль будет работать вне разрешённого частотного плана.
# Список допустимых значений: US, EU_433, EU_868, RU, UA_868, KZ_863 и т.д.
# см. https://meshtastic.org/docs/configuration/region-by-country/
region: RU

# Пресет модуляции LoRa. LONG_FAST - разумный баланс дальности и скорости
# по умолчанию у Meshtastic. Для леса/пересечённой местности можно
# рассмотреть LONG_MODERATE или LONG_SLOW (больше дальность, ниже скорость).
modem_preset: LONG_FAST

# Название приватного канала (виден в приложении как имя чата).
channel_name: team-chat

# Роль узла. CLIENT подходит для обоих устройств в паре из двух телефонов.
# Если добавите третье стационарное устройство для расширения покрытия,
# ему можно поставить ROUTER_CLIENT или REPEATER (см. README).
role: CLIENT

# Список ваших устройств. name используется как полное имя узла (Long Name),
# short_name - 4 символа, видны в списке узлов и на LoRa-пакетах.
devices:
  - id: alice
    long_name: Alice
    short_name: ALCE
  - id: bob
    long_name: Bob
    short_name: BOB1
